services:
  mysql:
    image: mysql:8.0
    container_name: absen_mysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone='+07:00'
    environment:
      TZ: Asia/Jakarta
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_strong_password_123}
      MYSQL_DATABASE: ${DB_NAME:-absensi_db}
      MYSQL_USER: ${DB_USER:-absensi_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-absen_pass_secure_123}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - mysql_data:/var/lib/mysql
      - ./backend/config/database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - absen_network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: absen_ai_service
    restart: always
    volumes:
      # Simpan cache bobot model AI (DeepFace / SFace) agar tidak download ulang tiap restart
      - deepface_cache:/root/.deepface
    networks:
      - absen_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: absen_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      TZ: Asia/Jakarta
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-absensi_user}
      DB_PASSWORD: ${DB_PASSWORD:-absen_pass_secure_123}
      DB_NAME: ${DB_NAME:-absensi_db}
      DB_CONNECTION_LIMIT: 30
      DB_MAX_IDLE: 10
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_attendance_key_replace_me}
      JWT_EXPIRES_IN: 24h
      AI_SERVICE_URL: http://ai-service:8000
      DEFAULT_RADIUS_METERS: ${DEFAULT_RADIUS_METERS:-100}
      UPLOAD_MAX_SIZE_MB: 10
      CORS_ORIGIN: '*'
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Persistent storage untuk foto absen, wajah, dan berkas izin
      - uploads_storage:/app/uploads
    ports:
      - "5000:5000"

    networks:
      - absen_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: absen_frontend
    restart: always
    depends_on:
      - backend
    expose:
      - 80
    networks:
      - absen_network
      - coolify

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: always
    environment:
      TZ: Asia/Jakarta
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8888:80"
    networks:
      - absen_network

volumes:
  mysql_data:
  deepface_cache:
  uploads_storage:

networks:
  absen_network:
    driver: bridge
  coolify:
    name: coolify
    external: true
